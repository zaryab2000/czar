# Czar contracts (T-003). Build and test with Arc Foundry only: FOUNDRY_PROFILE=arc arc-forge build.
# solc 0.8.30, evm_version prague, optimizer on (03 czar-vault.md header). OpenZeppelin v5.7.0 (03).
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
auto_detect_solc = false
deny_warnings = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.arc]
network = "arc"
# Hardfork pin (RV-058): not set until the hardfork Arc testnet runs is recorded (SCR-101).

# forge-lint runs on production sources. Test mocks copy upstream code (block.timestamp checks,
# string-to-bytes32 casts) on purpose and are excluded; compiler warnings still fail the build.
# M1 exit gate: invariant suites run with runs >= 256 and depth >= 64 (build-plan §5 M1).
[invariant]
runs = 256
depth = 64
fail_on_revert = false

[lint]
ignore = ["test/**/*.sol"]
# block-timestamp: every time comparison in the vault and factory is a spec rule (czar-vault.md §15.7,
# czar-vault-factory.md §5) on windows of seconds to days; Arc validator skew cannot change an outcome (D88).
exclude_lints = ["block-timestamp"]

[fmt]
line_length = 120
