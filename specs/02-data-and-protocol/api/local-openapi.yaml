openapi: 3.1.0
info:
  title: Czar daemon local viewer API
  version: "1.0"
  summary: Loopback routes the daemon serves to the desktop soul viewer (CZ-05, D34). Never exposed off the machine.
  description: |
    Served by the daemon (CZ-02) on its Unix domain socket (mode 0600) or on `127.0.0.1:<port>`; never on `0.0.0.0` (D3-08).
    Every request must carry the local viewer bearer token (stored in the OS keychain, same rules as K16) and, over HTTP,
    an `Origin` header equal to the viewer's own loopback origin; any other `Origin` gets 403 (DNS-rebinding defence, D3-08).
    Everything here is `local-only` (spec 02 §3). Nothing in these responses is sent to Czar's server.
    Errors use the same RFC 9457 shape as `openapi.yaml` (`czarCode`, `retryable`).
    Source: amendment AM-16; route list from spec 04 `local-soul-and-drives.md` CZ-05.
servers:
  - url: http://127.0.0.1
    description: Loopback only; the port is chosen at install and stored in daemon settings.
security:
  - LocalViewerToken: []
components:
  securitySchemes:
    LocalViewerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Local viewer token generated at install, kept in the OS keychain (@napi-rs/keyring, B6-17). Plus a mandatory Origin check over HTTP.
  schemas:
    Problem:
      type: object
      x-privacyClass: local-only
      additionalProperties: false
      required: [type, title, status, czarCode, retryable]
      properties:
        type: { type: string, format: uri }
        title: { type: string, maxLength: 120 }
        status: { type: integer }
        detail: { type: string, maxLength: 1000 }
        czarCode: { type: string, maxLength: 64 }
        retryable: { type: boolean }
    Belief:
      $ref: "../schemas/soul.schema.json#/$defs/Belief"
    BeliefEdit:
      type: object
      description: One user edit. User edits always win over the compiler (CZ-04).
      x-privacyClass: local-only
      additionalProperties: false
      required: [op]
      properties:
        op: { type: string, enum: [edit, pin, unpin, delete, setConfidence] }
        text: { type: string, maxLength: 500, description: New text for op=edit. }
        confidence: { type: number, minimum: 0, maximum: 1, description: For op=setConfidence. }
    SoulDiff:
      type: object
      description: '"What Czar learned about you this week" (CZ-04 §5.6). Lists of beliefIds.'
      x-privacyClass: local-only
      additionalProperties: false
      required: [version, baseVersion, added, strengthened, faded, removed]
      properties:
        version: { type: integer }
        baseVersion: { type: integer }
        added: { type: array, items: { type: string } }
        strengthened: { type: array, items: { type: string } }
        faded: { type: array, items: { type: string } }
        removed: { type: array, items: { type: string } }
    ReceiptSummary:
      type: object
      description: One observation behind a belief, shown as its redacted ActivityEvent summary.
      x-privacyClass: local-only
      additionalProperties: false
      required: [eventId, occurredAt, eventType, summary]
      properties:
        eventId: { type: string }
        occurredAt: { type: string, format: date-time }
        eventType: { type: string }
        summary: { type: string, maxLength: 2000 }
    ShadowReport:
      type: object
      description: The CZ-08 "what you missed" report. Amounts are USD strings and Amount6 (D51).
      x-privacyClass: local-only
      additionalProperties: false
      required: [periodStart, periodEnd, items, totalMinutes, totalEstimateAtomic]
      properties:
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [objectiveId, goal, minutesSaved, estimateAtomic]
            properties:
              objectiveId: { type: string }
              goal: { type: string, maxLength: 1000 }
              minutesSaved: { type: integer }
              estimateAtomic: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
        totalMinutes: { type: integer }
        totalEstimateAtomic: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
    EgressEntry:
      type: object
      description: One departure from the machine, from the daemon's audit_local table (counts and hashes only).
      x-privacyClass: local-only
      additionalProperties: false
      required: [at, kind, payloadHash, bytes, destination]
      properties:
        at: { type: string, format: date-time }
        kind: { type: string, enum: [objective, soul-version, ack, report, shadow-quote, model-excerpt] }
        payloadHash: { type: string, pattern: "^0x[0-9a-f]{64}$" }
        bytes: { type: integer, minimum: 0 }
        destination: { type: string, enum: [server, model-proxy] }
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
paths:
  /local/soul:
    get:
      summary: Current soul.json (spec 02 §4.2).
      operationId: getLocalSoul
      responses:
        "200": { description: Soul, content: { application/json: { schema: { $ref: "../schemas/soul.schema.json" } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /local/soul/beliefs/{beliefId}:
    post:
      summary: Edit, pin, unpin, delete or set the confidence of one belief.
      operationId: editLocalBelief
      parameters:
        - { name: beliefId, in: path, required: true, schema: { type: string, pattern: "^blf_[0-9A-HJKMNP-TV-Z]{26}$" } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BeliefEdit" } } }
      responses:
        "200": { description: Updated belief, content: { application/json: { schema: { $ref: "#/components/schemas/Belief" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /local/soul/diff:
    get:
      summary: Newest weekly diff.
      operationId: getLocalSoulDiff
      responses:
        "200": { description: Diff, content: { application/json: { schema: { $ref: "#/components/schemas/SoulDiff" } } } }
  /local/soul/receipts/{beliefId}:
    get:
      summary: Receipt summaries behind one belief.
      operationId: getLocalBeliefReceipts
      parameters:
        - { name: beliefId, in: path, required: true, schema: { type: string, pattern: "^blf_[0-9A-HJKMNP-TV-Z]{26}$" } }
      responses:
        "200": { description: Receipts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ReceiptSummary" } } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /local/shadow/report:
    get:
      summary: Shadow-mode "what you missed" report (CZ-08).
      operationId: getLocalShadowReport
      responses:
        "200": { description: Report, content: { application/json: { schema: { $ref: "#/components/schemas/ShadowReport" } } } }
  /local/audit/egress:
    get:
      summary: What left this machine, as counts and hashes.
      operationId: getLocalEgress
      parameters:
        - { name: since, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: Entries, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/EgressEntry" } } } } }

