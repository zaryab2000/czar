# Lint configuration for openapi.yaml and local-openapi.yaml (spec 02).
# Run from this directory: npx @redocly/cli@1.34.5 lint openapi.yaml local-openapi.yaml
extends:
  - recommended
rules:
  # D78: in Phase 1 the server and the app are served from http://localhost and the daemon's local API from
  # 127.0.0.1. A localhost server URL is the decided value, not a placeholder.
  no-server-example.com: off
