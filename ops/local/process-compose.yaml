version: "0.5"
# SCR-151: the indexer, server, signer and merchants start through ops/local/chain-session.mjs,
# which routes each to the per-chain-session database czar_<mode>_<S>. The *_DATABASE_URL values
# below are base URLs; the launcher replaces only the database name. Mode comes from
# CZAR_LOCAL_MODE (default clean; the FORK bring-up sets CZAR_LOCAL_MODE=fork).
processes:
  arc-anvil:
    command: arc-anvil --network arc --chain-id 5042002 --mnemonic-random --block-time 1 --quiet --port 8545
    working_dir: .
    readiness_probe:
      exec:
        command: >-
          curl --fail --silent --max-time 2 -X POST -H 'content-type: application/json'
          --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'
          http://127.0.0.1:8545
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 2
  circle-standins:
    command: >-
      pnpm --filter @czar/server exec node --disable-warning=ExperimentalWarning
      --experimental-strip-types ../../ops/local/circle-standins/server.ts
    working_dir: .
    environment:
      - CZAR_LOCAL_CONFIG=../../env/local.toml
      - CZAR_ARC_RPC_URL=http://127.0.0.1:8545
      - CZAR_STANDIN_BIND_ADDRESS=127.0.0.1
      - CZAR_STANDIN_PORT=4999
    depends_on:
      arc-anvil:
        condition: process_healthy
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 4999
        path: /health
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 2
  postgres:
    command: docker compose -f ops/local/compose.yaml up postgres
    working_dir: .
    readiness_probe:
      exec:
        command: docker compose -f ops/local/compose.yaml exec -T postgres pg_isready -U postgres
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 2
  deploy:
    command: bash ops/local/deploy.sh
    working_dir: ${CZAR_ROOT}
    depends_on:
      arc-anvil:
        condition: process_healthy
  indexer:
    command: node ops/local/chain-session.mjs --role indexer -- pnpm --filter @czar/indexer start:local
    working_dir: .
    environment:
      - CZAR_LOCAL_CONFIG=../../env/local.toml
      - CZAR_INDEXER_DEPLOYMENT_PATH=../../deployments/arc-local.json
      - CZAR_INDEXER_RPC_URL=http://127.0.0.1:8545
      - CZAR_ARC_RPC_URL=http://127.0.0.1:8545
      - CZAR_INDEXER_DISABLE_EXTERNAL_POLL=1
      - DATABASE_URL=postgres://postgres@127.0.0.1:15433/postgres
    depends_on:
      arc-anvil:
        condition: process_healthy
      deploy:
        condition: process_completed
      postgres:
        condition: process_healthy
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 42069
        path: /health
      initial_delay_seconds: 10
      period_seconds: 3
      timeout_seconds: 2
  server:
    command: node ops/local/chain-session.mjs --role server -- pnpm --filter @czar/server start:local
    working_dir: .
    environment:
      - CZAR_LOCAL_CONFIG=../../env/local.toml
      - CZAR_DATABASE_URL=postgres://postgres@127.0.0.1:15433/postgres
      - CZAR_SERVER_PORT=3000
      - CZAR_ARC_RPC_URL=http://127.0.0.1:8545
      - CZAR_INDEXER_URL=http://127.0.0.1:42069
    depends_on:
      postgres:
        condition: process_healthy
      arc-anvil:
        condition: process_healthy
      circle-standins:
        condition: process_healthy
      indexer:
        condition: process_healthy
    readiness_probe:
      http_get:
        host: localhost
        port: 3000
        path: /health
      initial_delay_seconds: 3
      period_seconds: 3
      timeout_seconds: 2
  signer:
    command: node ops/local/chain-session.mjs --role signer -- pnpm --filter @czar/signer start:local
    working_dir: .
    environment:
      - CZAR_LOCAL_CONFIG=../../env/local.toml
      - CZAR_SIGNER_RPC_URL=http://127.0.0.1:8545
      - CZAR_SIGNER_DEPLOYMENT_PATH=../../deployments/arc-local.json
      - CZAR_DATABASE_URL=postgres://postgres@127.0.0.1:15433/postgres
    depends_on:
      arc-anvil:
        condition: process_healthy
      deploy:
        condition: process_completed
      postgres:
        condition: process_healthy
      server:
        condition: process_healthy
      indexer:
        condition: process_healthy
    readiness_probe:
      exec:
        command: >-
          node -e 'require("node:net").connect(process.env.HOME + "/Library/Application Support/Czar/signer/signer.sock")
          .on("connect", function () { this.end(); process.exit(0); })
          .on("error", () => process.exit(1))'
      initial_delay_seconds: 5
      period_seconds: 3
      timeout_seconds: 2
  merchant-k10-ready:
    command: >-
      pnpm --filter @czar/signer exec node --disable-warning=ExperimentalWarning
      --experimental-strip-types scripts/check-signer-k10.ts
    working_dir: .
    environment:
      - CZAR_LOCAL_CONFIG=../../env/local.toml
    depends_on:
      postgres:
        condition: process_healthy
      server:
        condition: process_healthy
      signer:
        condition: process_healthy
  merchants:
    command: node ops/local/chain-session.mjs --role merchants -- pnpm --filter @czar/merchants start:local
    working_dir: .
    environment:
      - CZAR_MERCHANT_PORT=8787
      - CZAR_LOCAL_CONFIG=../../env/local.toml
      - CZAR_DATABASE_URL=postgres://postgres@127.0.0.1:15433/postgres
    depends_on:
      circle-standins:
        condition: process_healthy
      postgres:
        condition: process_healthy
      server:
        condition: process_healthy
      signer:
        condition: process_healthy
      merchant-k10-ready:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 8787
        path: /health
      initial_delay_seconds: 2
      period_seconds: 3
      timeout_seconds: 2
