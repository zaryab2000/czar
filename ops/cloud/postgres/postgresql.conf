# Czar cloud Postgres 16 (PM-014; SCR-170 §5).
#
# Mounted read-only at /etc/czar/postgres/postgresql.conf and named on the server's command line
# (`-c config_file=...`), so nothing in the data directory decides how the server listens or
# authenticates. Every setting not listed here keeps the Postgres 16 default.
#
# This file holds no credential. Role passwords are set by postgres-init from credential files
# (ops/cloud/postgres/init-roles.sh); the superuser has no password and is reachable only over the
# unix socket, as the image's own postgres user (pg_hba.conf).

# ── Network: loopback only (SCR-170 §1, §5) ──────────────────────────────────────
listen_addresses = '127.0.0.1'
port = 5432
unix_socket_directories = '/var/run/postgresql'
unix_socket_permissions = 0700

# ── Authentication ───────────────────────────────────────────────────────────────
password_encryption = 'scram-sha-256'
hba_file = '/etc/czar/postgres/pg_hba.conf'

# ── Logging ──────────────────────────────────────────────────────────────────────
# Postgres writes to stderr, which the container's `local` log driver keeps on the VM only. It is
# never shipped to Cloud Logging (logging ruling, PM-014): an error's DETAIL line can carry a real
# key value (`Key (pocket)=(0x...) already exists`) and would bypass the logging allowlist
# (cross-cutting §4). `terse` drops DETAIL, HINT, QUERY and CONTEXT from every error line, so even
# the local copy holds the error and its SQLSTATE only.
log_destination = 'stderr'
logging_collector = off
log_error_verbosity = terse
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# ── Locale and time ──────────────────────────────────────────────────────────────
timezone = 'UTC'
