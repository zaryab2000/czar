# Czar cloud Postgres client authentication (PM-014; SCR-170 §4, §5).
#
# Read from /etc/czar/postgres/pg_hba.conf (postgresql.conf `hba_file`), never from the data
# directory. The first matching line decides; anything that matches no line is refused.
#
# TYPE  DATABASE  USER                                                      ADDRESS       METHOD

# The superuser: the unix socket only, as the image's own `postgres` OS user (peer). It has no
# password, so it cannot log in over TCP at all. postgres-init and the healthcheck use this.
local   all       postgres                                                                peer

# One role per service, each with its own password file (SCR-170 §5), loopback TCP only.
host    czar      czar_api,czar_signer,czar_indexer,czar_merchants,czar_backup  127.0.0.1/32  scram-sha-256
