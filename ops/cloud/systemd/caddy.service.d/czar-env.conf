# Czar: hand Caddy the public domain (SCR-170 §2).
#
# CZAR_DOMAIN is a pointer, not a credential: it is the public host name the certificates are
# issued for. cloud-init writes /etc/czar/caddy.env from the instance metadata key of the same
# name, which ops/cloud/provision/create.sh sets from its --domain flag.
#
# No credential is ever passed to a service through its environment (SCR-170 §4, D70, D78).
[Service]
EnvironmentFile=/etc/czar/caddy.env
