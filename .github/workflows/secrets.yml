# Secret scan on every push and pull request (T-002, G0-12). Rules: gitleaks v8.30.1 defaults (C2-06).
# Reviewed false positives are listed by fingerprint in .gitleaksignore.
name: secrets

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.14"
          cache: false
      # Go module downloads are verified against the Go checksum database.
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: scan full history
        run: '"$(go env GOPATH)/bin/gitleaks" git --redact --exit-code 1 .'
