# CI for the Czar workspace (T-002). Every action is pinned to a full commit SHA.
name: ci

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: lint, typecheck, test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-no-secret-files.mjs
      - run: pnpm lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

  workflows:
    name: actionlint and zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.14"
          cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # Go module downloads are verified against the Go checksum database.
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: '"$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml'
      - run: uvx zizmor@1.31.1 --offline .github/workflows/

  contracts:
    name: contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # Arc Foundry from the checksummed release; never foundry-toolchain (A9-13).
      - name: install arc-foundry (run twice to check idempotence)
        run: |
          scripts/install-arc-foundry.sh "$HOME/.local/bin"
          scripts/install-arc-foundry.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: arc-anvil --version
      - run: diff -r contracts/src/interfaces docs/specs/03-smart-contracts/interfaces
      - name: build
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: arc
        run: arc-forge build --deny-warnings --sizes
      - name: test
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: arc
        run: arc-forge test -vvv

  indexer-arc-anvil:
    name: indexer paging against arc-anvil
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: |
          scripts/install-arc-foundry.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # T-030: the fault proxy sits in front of arc-anvil, which has no log-range cap of its own (RV-057).
      - name: start arc-anvil and mine 50,001 blocks
        run: |
          # --prune-history: keep no historical states; anvil otherwise spills them to disk and the runner
          # filled its disk after about 30,000 blocks.
          arc-anvil --network arc --chain-id 5042002 --port 8545 --prune-history > /dev/null 2>&1 &
          for _ in $(seq 1 30); do arc-cast chain-id --rpc-url http://127.0.0.1:8545 && break; sleep 1; done
          # arc-anvil mines a few hundred blocks a second and arc-cast gives up after 45 s, so mine
          # in 5,000-block chunks over curl with a long per-call limit, printing progress.
          mine() {
            curl -sS --fail --max-time 600 -H 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"anvil_mine\",\"params\":[\"$1\"]}" \
              http://127.0.0.1:8545 > /dev/null
          }
          for i in $(seq 1 10); do mine 0x1388; echo "mined chunk $i at ${SECONDS}s, $(df -h --output=avail / | tail -1) free"; done
          mine 0x1
          arc-cast block-number --rpc-url http://127.0.0.1:8545
      - name: 50,000-block sync through the fault proxy
        env:
          ARC_ANVIL_URL: http://127.0.0.1:8545
        run: pnpm --filter @czar/indexer exec vitest run test/sync-50k.test.ts

  redact-sidecar:
    name: czar-redact (Presidio helper)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: uv run pytest -q (T-064)
        working-directory: apps/redact-sidecar
        run: |
          uv sync --frozen
          uv run pytest -q
      - name: build the installer bundle
        run: scripts/bundle-redact-sidecar.sh "$RUNNER_TEMP/czar-redact"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: daemon runs the bundled helper with an empty environment
        env:
          CZAR_TEST_SIDECAR_CMD: ${{ runner.temp }}/czar-redact/bin/czar-redact
        run: pnpm --filter @czar/daemon exec vitest run test/sidecar-integration.test.ts

  web-e2e:
    name: web app in desktop Chromium and WebKit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @czar/web build
      # Browser builds pinned by @playwright/test 1.64.1.
      - run: pnpm --filter @czar/web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @czar/web e2e
