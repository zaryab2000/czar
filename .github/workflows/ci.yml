# CI for the Czar workspace (T-002). Every action is pinned to a full commit SHA.
name: ci

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: lint, typecheck, test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-no-secret-files.mjs
      - run: pnpm lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

  workflows:
    name: actionlint and zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.7"
          cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # Go module downloads are verified against the Go checksum database.
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: '"$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml'
      - run: uvx zizmor@1.31.1 --offline .github/workflows/

  contracts:
    name: contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # Arc Foundry from the checksummed release; never foundry-toolchain (A9-13).
      - name: install arc-foundry (run twice to check idempotence)
        run: |
          scripts/install-arc-foundry.sh "$HOME/.local/bin"
          scripts/install-arc-foundry.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: arc-anvil --version
      - run: diff -r contracts/src/interfaces specs/03-smart-contracts/interfaces
      - name: build
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: arc
        run: arc-forge build --deny-warnings --sizes
      - name: test
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: arc
        run: arc-forge test -vvv
